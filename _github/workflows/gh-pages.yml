name: gh-pages
on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    build:
        timeout-minutes: 420
        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                os: [ubuntu-24.04, windows-2025]
        steps:
            - uses: actions/checkout@v6.1.0

            - uses: moonrepo/setup-rust@v1.3.0
              with:
                  channel: "nightly-2025-05-09"
                  components: "clippy,rust-src,rustfmt"
                  targets: "wasm32-unknown-unknown"

            - uses: erlef/setup-beam@v1.24.1
              with:
                  otp-version: "29"
                  elixir-version: "1.20"
                  gleam-version: "1.19.2"
                  rebar3-version: "3.27.3"

            - uses: actions/setup-dotnet@v5.4.0
              with:
                  dotnet-version: "9.0.202"

            - uses: oven-sh/setup-bun@v2.2.0

            - uses: mlugg/setup-zig@v2.2.1
              with:
                  version: 0.17.0

            - uses: actions/setup-python@v6.3.0
              with:
                  python-version: "3.12.10"

            - uses: snok/install-poetry@v1.4.2
              with:
                  virtualenvs-create: true
                  virtualenvs-in-project: true
                  installer-parallel: true

            - run: pwsh scripts/workflow.ps1

            - uses: actions/upload-artifact@v5.0.0
              if: contains(matrix.os, 'ubuntu')
              with:
                  name: gh-pages
                  path: dist
                  retention-days: 30

    push:
        needs: build
        timeout-minutes: 180
        runs-on: ubuntu-24.04
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v6.1.0

            - uses: actions/download-artifact@v6.0.0
              with:
                  name: gh-pages
                  path: gh-pages

            - uses: peaceiris/actions-gh-pages@v4.1.0
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  publish_dir: gh-pages
